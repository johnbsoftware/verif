# Collecte quotidienne des vérifications et publication de feed.json sur GitHub Pages.
# Prérequis (une seule fois) :
#   1. Settings > Secrets and variables > Actions > New repository secret
#      Nom : FACTCHECK_API_KEY   Valeur : votre clé Google Fact Check Tools
#   2. Settings > Pages > Build and deployment > Source : « GitHub Actions »
# Le flux est ensuite servi à : https://<pseudo>.github.io/<dépôt>/feed.json
# Les pages du dossier pages/ (politique de confidentialité…) sont publiées à côté.
#
# GitHub désactive les tâches planifiées d'un dépôt public resté 60 jours sans commit.
# La dernière étape enregistre donc une date dans .github/derniere-activite.txt quand
# le dernier commit a plus de 45 jours (un petit commit automatique toutes les 6 semaines).

name: Collecte quotidienne

on:
  schedule:
    - cron: '30 4 * * *'   # 6 h 30 à Paris l'été, 5 h 30 l'hiver
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write   # commit de maintien (voir plus haut)
  pages: write
  id-token: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests du collecteur
        run: node --test collector/collector.test.mjs

      - name: Pages statiques
        run: mkdir -p site && cp -r pages/. site/

      - name: Collecte
        env:
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
          PREVIOUS_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.json
        run: node collector/collect.mjs --out site/feed.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Maintien de la collecte (commit si le dépôt est inactif depuis 45 jours)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Dernier commit il y a $age jours"
          if [ "$age" -ge 45 ]; then
            date -u +%F > .github/derniere-activite.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add .github/derniere-activite.txt
            git commit -m "Maintien de la collecte quotidienne"
            git push
          fi
